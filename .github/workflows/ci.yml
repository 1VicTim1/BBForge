name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Cache downloaded Linux packages
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-${{ matrix.os }}-test-v1
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci-apt.sh libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --no-default-features
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Browser workflow tests
        if: runner.os == 'Linux'
        run: cargo build -p bbcode-core --example analyze && npx playwright install --with-deps chromium && npx playwright test
      - name: Upload browser test traces
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  package-linux:
    name: Linux packages (amd64)
    # Runs next to the tests instead of after them; the release job still requires the tests.
    # Built on the oldest supported Ubuntu so the binaries also run on older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Cache downloaded Linux packages
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-ubuntu-22.04-package-v1
      - name: Install build and smoke-test dependencies
        run: bash scripts/ci-apt.sh libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf file xvfb xauth dbus-x11 webkit2gtk-driver python3
      - run: npm ci
      - name: Build .deb and .AppImage
        run: npm run tauri:build -- --bundles deb,appimage
      - name: Native release smoke without dev server
        run: BBFORGE_BINARY="$PWD/target/release/bbforge-app" bash scripts/smoke-desktop.sh
      - name: Build manual-install tarball
        run: bash scripts/package-tarball.sh
      - name: Collect packages
        run: |
          mkdir -p out
          cp target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage target/release/bundle/tarball/*.tar.gz out/
          (cd out && sha256sum * > SHA256SUMS-linux.txt && ls -la)
      - uses: actions/upload-artifact@v4
        with:
          name: bbforge-linux-amd64
          path: out/*
          if-no-files-found: error

  package-windows:
    name: Windows packages (x64)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build NSIS installer
        run: npm run tauri:build -- --bundles nsis
      - name: Collect installer and portable executable
        shell: bash
        run: |
          mkdir -p out
          cp target/release/bundle/nsis/*.exe out/
          version=$(node -p "require('./package.json').version")
          cp target/release/bbforge-app.exe "out/BBForge_${version}_x64-portable.exe"
          (cd out && sha256sum * > SHA256SUMS-windows.txt && ls -la)
      - uses: actions/upload-artifact@v4
        with:
          name: bbforge-windows-x64
          path: out/*
          if-no-files-found: error

  package-arch:
    name: Arch Linux package (x86_64)
    needs: package-linux
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bbforge-linux-amd64
          path: linux
      - name: Install makepkg tooling
        run: pacman -Syu --noconfirm --needed base-devel
      - name: Build .pkg.tar.zst
        run: |
          mkdir -p target/release/bundle/deb
          cp linux/*.deb target/release/bundle/deb/
          useradd -m builder
          chown -R builder: .
          # Dependencies are declared for installation only; the package repackages the prebuilt .deb.
          su builder -c "cd packaging/arch && makepkg -f --nodeps"
          mkdir -p out && cp packaging/arch/*.pkg.tar.zst out/
          (cd out && sha256sum * > SHA256SUMS-arch.txt && ls -la)
      - uses: actions/upload-artifact@v4
        with:
          name: bbforge-arch-x86_64
          path: out/*
          if-no-files-found: error

  release:
    name: GitHub release
    # Publishes automatically when package.json has a version without a v<version> tag yet
    # (just bump the version and push to main), or when a v* tag is pushed manually.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [test, package-linux, package-windows, package-arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether this version is new
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]] || ! git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "v$version is already released, nothing to publish"
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: BBForge ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
