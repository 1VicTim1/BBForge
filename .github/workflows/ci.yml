name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb xauth dbus-x11 webkit2gtk-driver python3
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --no-default-features
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Browser workflow tests
        if: runner.os == 'Linux'
        run: cargo build -p bbcode-core --example analyze && npx playwright install --with-deps chromium && npx playwright test
      - name: Build desktop bundles
        run: npm run tauri:build
      - name: Native release smoke without dev server
        if: runner.os == 'Linux'
        run: BBFORGE_BINARY="$PWD/target/release/bbforge-app" bash scripts/smoke-desktop.sh
