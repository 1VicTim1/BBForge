[package]
name = "bbforge-app"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = []
legacy-webkit = ["desktop"]
# Runtime without bundled assets: `tauri dev` loads the Vite dev server with HMR.
desktop-runtime = [
  "dep:tauri",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-opener",
  "tauri/wry",
]
# Release build: embeds the frontend from dist via the custom protocol.
desktop = ["desktop-runtime", "tauri/custom-protocol"]

[dependencies]
atomic-write-file = "0.3"
base64 = "0.22"
bbforge-plugin = { path = "../crates/bbforge-plugin" }
bbcode-core = { path = "../crates/bbcode-core" }
serde.workspace = true
serde_json = "1"
spellbook = "0.4"
semver = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
tauri = { version = "2", default-features = false, features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

